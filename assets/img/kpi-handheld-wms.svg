<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="hhBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="hhScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="hhShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="114" rx="28" ry="6" fill="#000" opacity="0.1"/>
  <g filter="url(#hhShadow)">
    <!-- device body -->
    <rect x="40" y="12" width="48" height="96" rx="10" fill="url(#hhBody)" stroke="#1e293b" stroke-width="1.5"/>
    <!-- top bezel / scanner window -->
    <rect x="48" y="20" width="32" height="10" rx="3" fill="#0f172a"/>
    <rect x="54" y="22" width="20" height="6" rx="2" fill="#22d3ee" opacity="0.85"/>
    <!-- main screen -->
    <rect x="48" y="36" width="32" height="42" rx="4" fill="url(#hhScreen)" stroke="#0369a1" stroke-width="1"/>
    <!-- WMS UI lines -->
    <rect x="52" y="42" width="18" height="3" rx="1.5" fill="#0c4a6e" opacity="0.55"/>
    <rect x="52" y="49" width="24" height="3" rx="1.5" fill="#0c4a6e" opacity="0.4"/>
    <rect x="52" y="56" width="14" height="3" rx="1.5" fill="#0c4a6e" opacity="0.4"/>
    <rect x="52" y="66" width="24" height="6" rx="2" fill="#0284c7"/>
    <!-- keypad -->
    <circle cx="52" cy="90" r="3.2" fill="#94a3b8"/>
    <circle cx="64" cy="90" r="3.2" fill="#94a3b8"/>
    <circle cx="76" cy="90" r="3.2" fill="#94a3b8"/>
    <circle cx="52" cy="100" r="3.2" fill="#94a3b8"/>
    <circle cx="64" cy="100" r="3.2" fill="#38bdf8"/>
    <circle cx="76" cy="100" r="3.2" fill="#94a3b8"/>
  </g>
</svg>
