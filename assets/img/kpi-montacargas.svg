<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="mBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="mCabin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#78350f" flood-opacity="0.3"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="112" rx="40" ry="7" fill="#000" opacity="0.1"/>
  <g filter="url(#mShadow)">
    <!-- mast -->
    <rect x="22" y="18" width="8" height="78" rx="2" fill="#334155"/>
    <rect x="18" y="20" width="16" height="6" rx="1" fill="#475569"/>
    <!-- forks -->
    <rect x="8" y="78" width="28" height="5" rx="1.5" fill="#64748b"/>
    <rect x="8" y="70" width="5" height="13" rx="1" fill="#64748b"/>
    <!-- body -->
    <path d="M36 48h46c4 0 8 4 8 8v34H36V48z" fill="url(#mBody)" stroke="#b45309" stroke-width="1.5"/>
    <!-- cabin -->
    <path d="M48 28h28c3 0 6 3 6 6v18H48V28z" fill="url(#mCabin)" stroke="#b45309" stroke-width="1.4"/>
    <rect x="54" y="34" width="10" height="10" rx="1.5" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="68" y="34" width="8" height="10" rx="1.5" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1"/>
    <!-- counterweight -->
    <rect x="78" y="56" width="18" height="28" rx="3" fill="#92400e"/>
    <!-- wheels -->
    <circle cx="48" cy="96" r="10" fill="#1e293b"/>
    <circle cx="48" cy="96" r="4" fill="#94a3b8"/>
    <circle cx="82" cy="96" r="10" fill="#1e293b"/>
    <circle cx="82" cy="96" r="4" fill="#94a3b8"/>
  </g>
</svg>
