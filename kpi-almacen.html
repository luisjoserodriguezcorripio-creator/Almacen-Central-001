<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="KPIs de Almacén — plan vs real y proyección gerencial" />
  <meta name="theme-color" content="#eef2f6" />
  <title>KPIs de Almacén</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/ac001-logo.svg?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/kpi-almacen.css?v=2" />
</head>
<body class="kpi-portal">
  <noscript><p style="padding:2rem;text-align:center">Activa JavaScript para usar KPIs de Almacén.</p></noscript>

  <div class="kpi-projection" aria-label="Proyección completa" title="Doble clic o Esc para salir">
    <header class="kpi-proj-head">
      <h1>KPIs de Almacén</h1>
      <p id="kpiProjSub">—</p>
    </header>
    <section class="kpi-proj-exec" aria-label="Resumen">
      <article class="kpi-exec-card is-ok"><span>En meta</span><strong id="projOk">0</strong></article>
      <article class="kpi-exec-card is-bad"><span>Fuera</span><strong id="projBad">0</strong></article>
      <article class="kpi-exec-card"><span>vs / contexto</span><strong id="projVs">—</strong></article>
      <article class="kpi-exec-card"><span>Cumplimiento</span><strong id="projPct">—</strong></article>
    </section>
    <div class="kpi-proj-board" id="kpiProjBoard"></div>
  </div>

  <div class="kpi-shell">
    <a class="kpi-home" href="index.html">← Portales</a>

    <header class="kpi-hero">
      <h1>KPIs de Almacén</h1>
    </header>

    <div class="kpi-toolbar">
      <div class="kpi-field">
        <label for="kpiDate">Fecha base</label>
        <input id="kpiDate" type="date" />
      </div>
      <div class="kpi-field" style="min-width:auto">
        <label>Acumulado</label>
        <div class="kpi-period" role="group" aria-label="Filtro de período">
          <button type="button" data-period="day" class="is-active">Día</button>
          <button type="button" data-period="yesterday">Ayer</button>
          <button type="button" data-period="week">Semana</button>
          <button type="button" data-period="month">Mes</button>
          <button type="button" data-period="trimestre">Trimestre</button>
        </div>
      </div>
      <div class="kpi-actions">
        <button type="button" class="kpi-btn kpi-btn-primary" id="kpiSave">Guardar día</button>
        <button type="button" class="kpi-btn kpi-btn-meet" id="kpiMeet">Proyección reunión</button>
      </div>
    </div>

    <section class="kpi-exec" aria-label="Resumen ejecutivo">
      <article class="kpi-exec-card is-ok"><span>En meta</span><strong id="execOk">0</strong></article>
      <article class="kpi-exec-card is-bad"><span>Fuera de meta</span><strong id="execBad">0</strong></article>
      <article class="kpi-exec-card"><span>vs / contexto</span><strong id="execVs">—</strong></article>
      <article class="kpi-exec-card"><span>Cumplimiento</span><strong id="execPct">—</strong></article>
    </section>

    <div class="kpi-layout">
      <section class="kpi-panel capture-block" aria-labelledby="entryTitle">
        <h2 id="entryTitle">Registro</h2>
        <div class="kpi-cols"><span>Indicador</span><span>Plan</span><span>Real</span></div>
        <div class="kpi-rows" id="kpiRows"></div>
      </section>

      <div>
        <section class="kpi-panel" aria-labelledby="resultTitle">
          <h2 id="resultTitle">Resultado</h2>
          <p class="kpi-sub" id="kpiResultSub">—</p>
          <div class="kpi-board" id="kpiBoard"></div>
        </section>
        <section class="kpi-except is-empty" id="kpiExcept" aria-labelledby="exceptTitle">
          <h2 id="exceptTitle">Excepciones</h2>
          <div id="kpiExceptList"></div>
        </section>
      </div>
    </div>

    <section class="kpi-month" aria-label="Histórico del mes">
      <div class="kpi-month-head">
        <h2>Histórico del mes</h2>
        <div class="kpi-month-nav">
          <button type="button" id="kpiMonthPrev" aria-label="Mes anterior">‹</button>
          <div class="kpi-month-label" id="kpiMonthLabel">—</div>
          <button type="button" id="kpiMonthNext" aria-label="Mes siguiente">›</button>
        </div>
      </div>
      <div class="kpi-month-grid" id="kpiMonthGrid"></div>
    </section>
  </div>

  <script src="js/platform-kpi-almacen.js?v=2"></script>
</body>
</html>
