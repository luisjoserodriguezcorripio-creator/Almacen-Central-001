<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06101f">
  <title>10 modelos · TV Recepción · Solo productividad (oscuro)</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06101f;
      --panel: #0b1a31;
      --card: rgba(2, 8, 20, 0.72);
      --line: rgba(148, 163, 184, 0.22);
      --text: #f8fafc;
      --muted: #94a3b8;
      --red: #f87171;
      --red-soft: rgba(248, 113, 113, 0.16);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.14);
      --green: #34d399;
      --green-soft: rgba(52, 211, 153, 0.14);
      --teal: #2dd4bf;
      --teal-soft: rgba(45, 212, 191, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #030912;
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
    }
    .banner {
      position: sticky; top: 0; z-index: 30;
      background: #fff7ed; color: #9a3412;
      border-bottom: 1px solid #fed7aa;
      padding: 10px 16px;
      display: flex; flex-wrap: wrap; gap: 10px 16px;
      align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 700;
    }
    .banner a { color: #9a3412; font-weight: 800; }
    .nav {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 12px 16px; background: #07111f; border-bottom: 1px solid var(--line);
      position: sticky; top: 42px; z-index: 29;
    }
    .nav a {
      text-decoration: none; color: #e2e8f0;
      border: 1px solid rgba(248,113,113,.4);
      background: rgba(248,113,113,.12);
      border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700;
    }
    .nav a:hover { background: rgba(248,113,113,.25); }
    .page { padding: 18px 16px 48px; max-width: 1480px; margin: 0 auto; }
    .opt {
      margin-bottom: 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: #071222;
      scroll-margin-top: 110px;
    }
    .opt-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      align-items: baseline; justify-content: space-between;
      background: rgba(15, 23, 42, 0.75);
    }
    .opt-head h2 { margin: 0; font-size: 1rem; }
    .opt-head p { margin: 0; color: var(--muted); font-size: 0.82rem; max-width: 52rem; }
    .pick {
      border: 0; border-radius: 999px; padding: 7px 12px;
      background: #ea580c; color: #fff; font-weight: 800; cursor: pointer;
    }
    .stage {
      padding: 12px;
      min-height: 420px;
      background: linear-gradient(160deg, #071222, #0b1a31 55%, #06101f);
    }
    .tv {
      background: rgba(2, 8, 20, 0.55);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      min-height: 380px;
      display: flex;
      flex-direction: column;
    }
    .tv-head {
      display: flex; gap: 12px; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid var(--line);
      flex-wrap: wrap; background: rgba(2, 8, 20, 0.45);
    }
    .brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
    .logo {
      width: 38px; height: 38px; border-radius: 999px; background: #c8102e;
      color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 0.85rem;
      flex-shrink: 0;
    }
    .brand h3 { margin: 0; font-size: 0.95rem; }
    .brand p { margin: 2px 0 0; font-size: 0.68rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .live {
      display: inline-flex; align-items: center; gap: 6px; margin-left: 8px;
      color: var(--red); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.05em;
    }
    .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px rgba(248,113,113,.2); }

    .role-op { --role: var(--red); --role-soft: var(--red-soft); }
    .role-val { --role: var(--amber); --role-soft: var(--amber-soft); }
    .role-dig { --role: var(--green); --role-soft: var(--green-soft); }
    .role-ubi { --role: var(--teal); --role-soft: var(--teal-soft); }

    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; min-width: 0; min-height: 0;
    }
    .panel-title {
      margin: 0 0 10px; font-size: 0.68rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.08em; color: #93c5fd;
    }
    .role-card {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px;
      background: rgba(255,255,255,.03); min-width: 0; min-height: 0;
    }
    .role-card.role-op, .role-card.role-val, .role-card.role-dig, .role-card.role-ubi {
      border-color: color-mix(in srgb, var(--role) 40%, transparent);
      background: linear-gradient(180deg, rgba(255,255,255,.04), var(--role-soft));
    }
    .role-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px;
    }
    .role-name {
      font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--role, var(--red));
    }
    .role-total {
      font-size: 1.35rem; font-weight: 900; color: var(--text); line-height: 1;
    }
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: grid; grid-template-columns: minmax(4.2rem, 32%) minmax(0, 1fr) auto;
      gap: 8px; align-items: center; font-size: 0.78rem;
    }
    .row-name { font-weight: 700; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track { height: 10px; border-radius: 999px; background: rgba(148,163,184,.18); overflow: hidden; }
    .fill { height: 100%; border-radius: inherit; background: var(--role, var(--red)); box-shadow: 0 0 10px color-mix(in srgb, var(--role) 35%, transparent); }
    .row-num { font-weight: 800; color: var(--text); min-width: 1.6em; text-align: right; }

    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tab {
      border: 1px solid var(--line); background: rgba(2,8,20,.55); border-radius: 999px;
      padding: 6px 11px; font-size: 0.68rem; font-weight: 800; color: #cbd5e1; cursor: default;
    }
    .tab.is-on { color: #0f172a; border-color: transparent; }
    .tab.role-op.is-on { background: var(--red); }
    .tab.role-val.is-on { background: var(--amber); }
    .tab.role-dig.is-on { background: var(--green); }
    .tab.role-ubi.is-on { background: var(--teal); }

    .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px 5px 5px;
      background: rgba(2,8,20,.45); font-size: 0.78rem; font-weight: 700; color: #e2e8f0;
    }
    .chip-av {
      width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center;
      font-size: 0.62rem; font-weight: 900; color: #0f172a; background: var(--role, var(--red));
    }
    .chip strong { font-weight: 900; color: #fff; }

    .rank { display: flex; flex-direction: column; gap: 8px; }
    .rank-item {
      display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center;
      padding: 8px 10px; border-radius: 10px; background: rgba(2,8,20,.45); border: 1px solid var(--line);
    }
    .rank-pos {
      width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center;
      font-size: 0.68rem; font-weight: 900; color: #0f172a; background: var(--role, var(--red));
    }

    .donut-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; height: 100%; }
    .donut-card {
      text-align: center; border: 1px solid var(--line); border-radius: 14px; padding: 18px 10px;
      background: var(--card); display: flex; flex-direction: column; justify-content: center; gap: 10px;
    }
    .donut {
      width: 88px; height: 88px; border-radius: 50%; margin: 0 auto;
      background: conic-gradient(var(--role) calc(var(--pct) * 1%), rgba(148,163,184,.18) 0);
      display: grid; place-items: center;
    }
    .donut span {
      width: 58px; height: 58px; border-radius: 50%; background: #0b1a31;
      display: grid; place-items: center; font-size: 1.1rem; font-weight: 900; color: #fff;
    }
    .donut-lbl { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }

    .big-total { font-size: 2.4rem; font-weight: 900; line-height: 1; color: var(--role, var(--text)); }
    .big-sub { font-size: 0.72rem; color: var(--muted); font-weight: 700; margin-top: 4px; }

    .selected-tag { display: none; margin-left: 8px; color: #86efac; font-size: 0.78rem; font-weight: 800; }
    .opt.is-picked .selected-tag { display: inline; }
    .opt.is-picked { outline: 2px solid #34d399; }

    .body-pad { padding: 14px; flex: 1; min-height: 0; display: flex; flex-direction: column; }

    /* layouts — solo gráficos */
    .L1 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; height: 100%; }
    .L2 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; height: 100%; }
    .L3 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; height: 100%; }
    .L3 .role-card { display: flex; flex-direction: column; }
    .L3 .rows { flex: 1; justify-content: center; }

    .L4 { display: grid; grid-template-columns: 220px 1fr; gap: 12px; height: 100%; }
    .L4 .tab-side { display: flex; flex-direction: column; gap: 8px; }
    .L4 .tab-side .tab { width: 100%; text-align: left; border-radius: 10px; }

    .L5 { display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 10px; height: 100%; }
    .L5 .role-card { display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: center; }
    .L5 .role-head { margin: 0; flex-direction: column; align-items: flex-start; gap: 4px; }

    .L6 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; height: 100%; }
    .L6 .role-card { display: flex; flex-direction: column; justify-content: space-between; }

    .L7 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; height: 100%; }

    .L8 { height: 100%; }

    .L9 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; height: 100%; }
    .L9 .role-card { display: flex; flex-direction: column; gap: 12px; }

    .L10 { display: grid; grid-template-rows: 1fr 1fr; gap: 12px; height: 100%; }
    .L10 .dual-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }

    @media (max-width: 980px) {
      .L1, .L3, .L6, .L7, .L9, .donut-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .L4 { grid-template-columns: 1fr; }
      .L5 .role-card { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="banner">
    <span>PREVIEW · 10 modelos TV · Solo gráficos de productividad (fondo oscuro) · Sin KPIs ni tabla</span>
    <a href="../recepcion-pantalla.html">Ir a pantalla actual</a>
  </div>
  <div class="nav">
    <a href="#o1">1 Stack</a>
    <a href="#o2">2 Grid 2×2</a>
    <a href="#o3">3 Columnas</a>
    <a href="#o4">4 Tabs</a>
    <a href="#o5">5 Bandas</a>
    <a href="#o6">6 Totales</a>
    <a href="#o7">7 Ranking</a>
    <a href="#o8">8 Donuts</a>
    <a href="#o9">9 Chips</a>
    <a href="#o10">10 Dual</a>
  </div>
  <div class="page" id="gallery"></div>

  <script>
    var roles = {
      operadores: {
        key: 'op', label: 'Operadores',
        people: [['Pedro', 94], ['Robert', 85], ['Schad', 9]]
      },
      validadores: {
        key: 'val', label: 'Validadores',
        people: [['Julio L.', 62], ['Handerson', 48], ['Nelson', 41], ['Richard', 28]]
      },
      digitadores: {
        key: 'dig', label: 'Digitadores',
        people: [['Francis', 91], ['Andy', 55], ['Yessica', 30]]
      },
      ubicadores: {
        key: 'ubi', label: 'Ubicadores',
        people: [['Rolando', 58], ['Obispo', 47], ['Yeuri', 39], ['Yeison', 35]]
      }
    };

    function sum(people) {
      return people.reduce(function (a, p) { return a + p[1]; }, 0);
    }
    function maxN(people) {
      return Math.max.apply(null, people.map(function (p) { return p[1]; }).concat([1]));
    }
    function initials(name) {
      return String(name || '').split(/\s+/).map(function (p) { return p.charAt(0); }).join('').slice(0, 2).toUpperCase();
    }

    function headHtml() {
      return '<div class="tv-head">' +
        '<div class="brand"><div class="logo">AC</div><div>' +
        '<h3>Almacén Central AC <span class="live">EN VIVO</span></h3>' +
        '<p>Productividad · Validador · Ubicador · Operador · Digitador</p>' +
        '</div></div></div>';
    }

    function rowsHtml(people) {
      var mx = maxN(people);
      return '<div class="rows">' + people.map(function (p) {
        var pct = Math.round((p[1] / mx) * 100);
        return '<div class="row"><span class="row-name">' + p[0] + '</span>' +
          '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
          '<span class="row-num">' + p[1] + '</span></div>';
      }).join('') + '</div>';
    }

    function roleCard(role) {
      return '<div class="role-card role-' + role.key + '">' +
        '<div class="role-head"><span class="role-name">' + role.label + '</span>' +
        '<span class="role-total">' + sum(role.people) + '</span></div>' +
        rowsHtml(role.people) + '</div>';
    }

    function allRoleCards() {
      return roleCard(roles.operadores) + roleCard(roles.validadores) +
        roleCard(roles.digitadores) + roleCard(roles.ubicadores);
    }

    function tabsPanel() {
      return '<div class="panel" style="height:100%;display:flex;flex-direction:column">' +
        '<div class="L4" style="flex:1">' +
        '<div class="tab-side">' +
        '<span class="tab role-op is-on">Operadores</span>' +
        '<span class="tab role-val">Validadores</span>' +
        '<span class="tab role-dig">Digitadores</span>' +
        '<span class="tab role-ubi">Ubicadores</span></div>' +
        '<div style="min-height:0">' + roleCard(roles.operadores) + '</div>' +
        '</div></div>';
    }

    function totalsCard(role) {
      var top = role.people[0];
      return '<div class="role-card role-' + role.key + '">' +
        '<div class="role-name">' + role.label + '</div>' +
        '<div class="big-total">' + sum(role.people) + '</div>' +
        '<div class="big-sub">Top: ' + top[0] + ' · ' + top[1] + '</div>' +
        '<div style="margin-top:12px">' + rowsHtml(role.people.slice(0, 3)) + '</div></div>';
    }

    function rankBoard(role) {
      var sorted = role.people.slice().sort(function (a, b) { return b[1] - a[1]; });
      return '<div class="role-card role-' + role.key + '"><div class="role-name">' + role.label + '</div>' +
        '<div class="rank" style="margin-top:10px">' + sorted.map(function (p, i) {
          return '<div class="rank-item"><span class="rank-pos">' + (i + 1) + '</span>' +
            '<span class="row-name">' + p[0] + '</span><strong>' + p[1] + '</strong></div>';
        }).join('') + '</div></div>';
    }

    function donutsHtml() {
      var totals = [
        sum(roles.operadores.people),
        sum(roles.validadores.people),
        sum(roles.digitadores.people),
        sum(roles.ubicadores.people)
      ];
      var mx = Math.max.apply(null, totals);
      var list = [
        [roles.operadores, totals[0]],
        [roles.validadores, totals[1]],
        [roles.digitadores, totals[2]],
        [roles.ubicadores, totals[3]]
      ];
      return '<div class="donut-row">' + list.map(function (item) {
        var role = item[0];
        var n = item[1];
        var pct = Math.round((n / mx) * 100);
        return '<div class="donut-card role-' + role.key + '">' +
          '<div class="donut" style="--pct:' + pct + '"><span>' + n + '</span></div>' +
          '<div class="donut-lbl">' + role.label + '</div>' +
          rowsHtml(role.people) +
          '</div>';
      }).join('') + '</div>';
    }

    function chipsPanel(role) {
      return '<div class="role-card role-' + role.key + '">' +
        '<div class="role-head"><span class="role-name">' + role.label + '</span>' +
        '<span class="role-total">' + sum(role.people) + '</span></div>' +
        '<div class="chip-grid">' + role.people.map(function (p) {
          return '<span class="chip"><span class="chip-av">' + initials(p[0]) + '</span>' +
            p[0] + ' <strong>' + p[1] + '</strong></span>';
        }).join('') + '</div>' +
        '<div style="margin-top:4px">' + rowsHtml(role.people) + '</div></div>';
    }

    function bandCard(role) {
      return '<div class="role-card role-' + role.key + '">' +
        '<div class="role-head"><span class="role-name">' + role.label + '</span>' +
        '<span class="role-total">' + sum(role.people) + '</span></div>' +
        rowsHtml(role.people) + '</div>';
    }

    var options = [
      {
        id: 'o1', title: 'Opción 1 · Stack 4 paneles',
        desc: 'Cuatro paneles en fila: Operadores, Validadores, Digitadores y Ubicadores.',
        html: '<div class="body-pad"><div class="L1">' + allRoleCards() + '</div></div>'
      },
      {
        id: 'o2', title: 'Opción 2 · Grid 2×2',
        desc: 'Cuadrícula 2×2 a pantalla completa solo con gráficos de productividad.',
        html: '<div class="body-pad"><div class="L2">' + allRoleCards() + '</div></div>'
      },
      {
        id: 'o3', title: 'Opción 3 · Columnas altas',
        desc: 'Cuatro columnas iguales, barras grandes para lectura en TV.',
        html: '<div class="body-pad"><div class="L3">' + allRoleCards() + '</div></div>'
      },
      {
        id: 'o4', title: 'Opción 4 · Tabs laterales',
        desc: 'Menú de rol a la izquierda; un gráfico grande a la derecha.',
        html: '<div class="body-pad">' + tabsPanel() + '</div>'
      },
      {
        id: 'o5', title: 'Opción 5 · Bandas horizontales',
        desc: 'Cuatro bandas apiladas de borde a borde, una por rol.',
        html: '<div class="body-pad"><div class="L5">' +
          bandCard(roles.operadores) + bandCard(roles.validadores) +
          bandCard(roles.digitadores) + bandCard(roles.ubicadores) +
          '</div></div>'
      },
      {
        id: 'o6', title: 'Opción 6 · Totales grandes + top',
        desc: 'Número dominante por rol y top performer, con barras debajo.',
        html: '<div class="body-pad"><div class="L6">' +
          totalsCard(roles.operadores) + totalsCard(roles.validadores) +
          totalsCard(roles.digitadores) + totalsCard(roles.ubicadores) +
          '</div></div>'
      },
      {
        id: 'o7', title: 'Opción 7 · Rankings',
        desc: 'Leaderboard por rol con posición 1–n.',
        html: '<div class="body-pad"><div class="L7">' +
          rankBoard(roles.operadores) + rankBoard(roles.validadores) +
          rankBoard(roles.digitadores) + rankBoard(roles.ubicadores) +
          '</div></div>'
      },
      {
        id: 'o8', title: 'Opción 8 · Donuts + barras',
        desc: 'Total circular por rol y detalle de personas debajo.',
        html: '<div class="body-pad L8">' + donutsHtml() + '</div>'
      },
      {
        id: 'o9', title: 'Opción 9 · Chips + barras',
        desc: 'Avatares con conteo y barras de productividad por rol.',
        html: '<div class="body-pad"><div class="L9">' +
          chipsPanel(roles.operadores) + chipsPanel(roles.validadores) +
          chipsPanel(roles.digitadores) + chipsPanel(roles.ubicadores) +
          '</div></div>'
      },
      {
        id: 'o10', title: 'Opción 10 · Dual 2+2',
        desc: 'Arriba Operadores + Validadores; abajo Digitadores + Ubicadores.',
        html: '<div class="body-pad"><div class="L10">' +
          '<div class="dual-row">' + roleCard(roles.operadores) + roleCard(roles.validadores) + '</div>' +
          '<div class="dual-row">' + roleCard(roles.digitadores) + roleCard(roles.ubicadores) + '</div>' +
          '</div></div>'
      }
    ];

    var gallery = document.getElementById('gallery');
    gallery.innerHTML = options.map(function (opt) {
      return '<section class="opt" id="' + opt.id + '">' +
        '<div class="opt-head"><div><h2>' + opt.title +
        ' <span class="selected-tag">· ELEGIDA</span></h2><p>' + opt.desc + '</p></div>' +
        '<button type="button" class="pick" data-pick="' + opt.id + '">Elegir esta</button></div>' +
        '<div class="stage"><div class="tv">' + headHtml() + opt.html + '</div></div></section>';
    }).join('');

    gallery.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-pick]');
      if (!btn) return;
      document.querySelectorAll('.opt').forEach(function (el) { el.classList.remove('is-picked'); });
      var sec = document.getElementById(btn.getAttribute('data-pick'));
      if (sec) sec.classList.add('is-picked');
      try { localStorage.setItem('rec_tv_prod_pick', btn.getAttribute('data-pick')); } catch (err) {}
    });

    try {
      var saved = localStorage.getItem('rec_tv_prod_pick');
      if (saved && document.getElementById(saved)) document.getElementById(saved).classList.add('is-picked');
    } catch (err) {}
  </script>
</body>
</html>
