<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>QR Supervisor — Control de Turnos</title>
  <style>
    @page { size: letter; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 8.5in; height: 11in; font-family: 'Segoe UI', Arial, sans-serif; color: #0f2347; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .page { width: 8.5in; height: 11in; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
    .head { background: linear-gradient(135deg, #003882 0%, #001f47 100%); color: #fff; text-align: center; padding: 0.38in 0.45in 0.32in; }
    .head .eyebrow { font-size: 15pt; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.92; margin-bottom: 0.12in; }
    .head h1 { font-size: 34pt; line-height: 1.08; font-weight: 800; margin-bottom: 0.1in; }
    .head p { font-size: 17pt; line-height: 1.35; font-weight: 600; opacity: 0.95; }
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0.28in 0.45in 0.2in; text-align: center; }
    .qr-wrap { padding: 0.14in; border: 6px solid #003882; border-radius: 14px; background: #fff; box-shadow: 0 8px 28px rgba(0, 56, 130, 0.18); }
    .qr-wrap img { display: block; width: 4.85in; height: 4.85in; }
    .scan { margin-top: 0.32in; font-size: 26pt; font-weight: 800; color: #003882; letter-spacing: 0.04em; }
    .hint { margin-top: 0.18in; font-size: 17pt; font-weight: 600; color: #5c6f85; max-width: 6.5in; line-height: 1.4; }
    .foot { background: #eef4fb; border-top: 4px solid #003882; padding: 0.22in 0.45in; text-align: center; }
    .foot p { font-size: 15pt; line-height: 1.45; font-weight: 600; color: #1a2d4a; }
    .foot strong { color: #003882; }
  </style>
</head>
<body>
  <div class="page">
    <header class="head"><p class="eyebrow">Almacén Central 001 · Supervisor</p><h1>Validación<br>de turnos</h1><p>Celular: validar · PC: panel completo</p></header>
    <main class="main">
      <div class="qr-wrap"><img src="turnos-qr-supervisor.png" alt="Código QR supervisor"></div>
      <p class="scan">ESCANEE CON LA CÁMARA DEL TELÉFONO</p>
      <p class="hint">Turnos Supervisor · Almacén Central 001</p>
    </main>
    <footer class="foot"><p><strong>Supervisor:</strong> guarde el acceso en inicio, active notificaciones e inicie sesión. En móvil solo valida solicitudes pendientes.</p></footer>
  </div>
</body>
</html>
